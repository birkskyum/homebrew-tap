# Installs, tests and audits the formula on macOS and Linux.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manby:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew install birkskyum/tap/manby
      - run: brew test birkskyum/tap/manby
      - run: brew audit --strict --online birkskyum/tap/manby
